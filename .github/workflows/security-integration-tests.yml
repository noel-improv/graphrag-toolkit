# Runs the grouped security integration suite against live engines (service
# containers) to confirm each query-injection fix holds. Triggered on release so
# AppSec gets a per-release demonstration, and on PRs touching the fixed sinks or
# the suite itself so regressions are caught before merge.
name: Security Integration Tests

permissions:
  contents: read

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "lexical-graph/src/graphrag_toolkit/lexical_graph/storage/vector/pg_vector_indexes.py"
      - "lexical-graph/src/graphrag_toolkit/lexical_graph/storage/graph/graph_utils.py"
      - "byokg-rag/src/graphrag_toolkit/byokg_rag/graphstore/neptune.py"
      - "integration-tests/security/**"
      - ".github/workflows/security-integration-tests.yml"
  workflow_dispatch:

jobs:
  pgvector-injection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and suite
        run: |
          python -m pip install --upgrade pip
          pip install ./lexical-graph
          pip install -r integration-tests/security/requirements.txt
      - name: Run PGVector injection tests
        env:
          PGVECTOR_TEST_DSN: "host=localhost port=5432 dbname=testdb user=test password=test"
        run: pytest integration-tests/security/test_pgvector_sql_injection.py -v

  cypher-injection:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.25-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages and suite
        run: |
          python -m pip install --upgrade pip
          pip install ./lexical-graph ./byokg-rag
          pip install -r integration-tests/security/requirements.txt
      - name: Run OpenCypher injection tests
        env:
          NEO4J_TEST_URI: "bolt://localhost:7687"
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: testpassword123
        run: |
          pytest \
            integration-tests/security/test_opencypher_filter_injection.py \
            integration-tests/security/test_byokg_property_injection.py -v
